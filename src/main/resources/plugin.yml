name: SafeSurvival
version: '${version}'


main: fr.yopytuuh.safesurvival.SafeSurvival
description: "A configurable plugin that blocks unsafe commands to ensure fair survival gameplay with friends."
author: yopytuuh
api-version: '26.1.2'
load: POSTWORLD
prefix: "SafeSurvival"

commands:
  ss:
    description: "safe survival commands"
    permission: safesurvival.admin
    usage: "/ss"

permissions:
  safesurvival.admin:
    description: "Admin permissions"
    default: op