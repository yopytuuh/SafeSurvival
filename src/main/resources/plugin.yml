name: SafeSurvival
version: '${version}'


main: fr.yopytuuh.safesurvival.SafeSurvival
description: "A configurable plugin that blocks unsafe commands to ensure fair survival gameplay with friends."
author: yopytuuh
api-version: '26.1.2'
load: POSTWORLD
prefix: "SafeSurvival"

commands:
  ss:
    description: safe survival commands
    permission: safesurvival.admin
    usage: /ss

permissions:
  safesurvival.admin:
    description: Admin permissions
    default: op
  safesurvival.config:
    description: Allows access to the SafeSurvival configuration GUI
    default: op
  safesurvival.reload:
    description: Allows the use of /ss reload
    default: op
  safesurvival.status:
    description: Allows the use of /ss status
    default: op
  safesurvival.alerts:
    description: Allows receiving SafeSurvival alerts
    default: op